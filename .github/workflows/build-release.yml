name: OrangeFox - Build pipa

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated images as a GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag used when publish_release is enabled
        required: false
        type: string
  push:
    tags:
      - "orangefox-*"

permissions:
  contents: write

concurrency:
  group: orangefox-pipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_DIR: ${{ github.workspace }}/OrangeFox/fox_16.0
  RELEASE_DIR: ${{ github.workspace }}/release
  DEVICE_TREE_REPO: https://github.com/mengguizzz/twrp_device_xiaomi_pipa.git
  DEVICE_PATH: device/xiaomi/pipa
  BUILD_LABEL: orangefox_pipa_A16_${{ github.run_number }}_${{ github.sha }}

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Clean up hosted runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends aria2 zram-tools
          if ! sudo modprobe zram; then
            kernel_release=$(uname -r)
            module_work=$(mktemp -d /tmp/zram-modules.XXXXXX)
            (
              cd "$module_work"
              apt-get download "linux-modules-extra-${kernel_release}"
              dpkg-deb -x ./*.deb extracted
              sudo cp -a "extracted/lib/modules/${kernel_release}/." \
                "/lib/modules/${kernel_release}/"
              sudo depmod -a "$kernel_release"
            )
            rm -rf "$module_work"
            sudo modprobe zram
          fi
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh
          cd ..
          rm -rf scripts
          sudo apt autoclean >/dev/null || true
          sudo apt autoremove -qy 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/ 2>/dev/null || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: "12288"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          create-symlink: true

      - name: Set up zram
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe zram
          sudo sed -i -E 's/^#?PERCENT=.*/PERCENT=90/' /etc/default/zramswap
          sudo sed -i -E 's/^#?PRIORITY=.*/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl
          sudo swapon --show

      - name: Set up OrangeFox 16.0 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch 16.0 --path "$SOURCE_DIR"

      - name: Clone pipa device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/device/xiaomi"
          git clone "$DEVICE_TREE_REPO" "$SOURCE_DIR/$DEVICE_PATH"
          cd "$SOURCE_DIR/$DEVICE_PATH"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          git log -1 --oneline

      - name: Build OrangeFox
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          export FOX_BUILD_DEVICE=pipa
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          sed -i 's/return sandboxConfig\.working/return false/g' \
            build/soong/ui/build/sandbox_linux.go
          set +u
          source build/envsetup.sh
          set -u
          lunch twrp_pipa-bp2a-eng
          make clean
          mka adbd bootimage

      - name: Collect recovery images
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$SOURCE_DIR/out/target/product/pipa"
          mkdir -p "$RELEASE_DIR"

          mapfile -t built_images < <(
            find "$OUT_DIR" -maxdepth 1 -type f \
              \( -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' -o -name 'boot.img' \) \
              -print | sort
          )
          if (( ${#built_images[@]} == 0 )); then
            echo "OrangeFox produced no images in $OUT_DIR" >&2
            find "$OUT_DIR" -maxdepth 2 -type f | sort | tail -100 >&2
            exit 1
          fi
          cp -v "${built_images[@]}" "$RELEASE_DIR/"

          if [[ -f "$OUT_DIR/boot.img" ]]; then
            cp "$OUT_DIR/boot.img" "$RELEASE_DIR/${BUILD_LABEL}_boot.img"
            python3 "$SOURCE_DIR/$DEVICE_PATH/tools/make_fbboot_image.py" \
              "$OUT_DIR/boot.img" "$RELEASE_DIR/${BUILD_LABEL}_fbboot.img"
          fi

          expected_kernel=25536e9f31493c39089a6279786fb89fb548fad412c49ef8e8b8c565872b3554
          actual_kernel=$(sha256sum "$OUT_DIR/kernel" | awk '{print $1}')
          if [[ "$actual_kernel" != "$expected_kernel" ]]; then
            echo "Unexpected kernel: $actual_kernel" >&2
            exit 1
          fi

          grep -q '^ro.color597.product_name=Xiaomi Pad 6$' \
            "$OUT_DIR/recovery/root/prop.default"

          {
            echo "device=pipa"
            echo "ui=OrangeFox"
            echo "manifest=OrangeFox/Manifest:fox_16.0"
            echo "device_tree_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "kernel_sha256=$actual_kernel"
            for image in "$RELEASE_DIR"/*; do
              [[ -f "$image" ]] || continue
              echo "$(basename "$image")_sha256=$(sha256sum "$image" | awk '{print $1}')"
            done
          } > "$RELEASE_DIR/BUILD_INFO.txt"

          find "$RELEASE_DIR" -maxdepth 1 -type f \
            ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$RELEASE_DIR/SHA256SUMS.txt"

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Xiaomi Pad 6 (pipa) OrangeFox"
            echo
            echo "Built from OrangeFox fox_16.0 and device-tree commit \`$GITHUB_SHA\`."
            echo
            echo "## Build information"
            echo
            echo '```'
            cat "$RELEASE_DIR/BUILD_INFO.txt"
            echo '```'
            echo
            echo "Flash the produced boot image directly. The fbboot image is only for \`fastboot boot\` and must not be flashed."
          } > "$RELEASE_DIR/release-notes.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-pipa-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 7

  diagnose:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download complete Actions log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p action-logs
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/logs" \
            -o action-logs.zip
          unzip -q action-logs.zip -d action-logs

      - name: Upload complete Actions log
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-pipa-${{ github.run_number }}-action-logs
          path: action-logs/**
          if-no-files-found: error

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/orangefox-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: orangefox-pipa-${{ github.run_number }}
          path: release

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            echo "release_tag is required when publish_release is enabled" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OrangeFox for Xiaomi Pad 6 - ${{ steps.release.outputs.tag }}
          body_path: release/release-notes.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
